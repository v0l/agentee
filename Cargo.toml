[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/agentee"

[workspace.dependencies]
agentee-core = { path = "crates/agentee-core" }
agentee-kicad = { path = "crates/agentee-kicad" }
agentee-view = { path = "crates/agentee-view" }
agentee-sim = { path = "crates/agentee-sim" }
agentee-fab = { path = "crates/agentee-fab" }
agentee-layout = { path = "crates/agentee-layout" }
agentee-3d = { path = "crates/agentee-3d" }
agentee-parts = { path = "crates/agentee-parts" }
sims-rf = { git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
sims-progress = { git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
sims-circuit = { git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
sims-quasistatic = { git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
sims-logic = { git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
sims-field = { git = "https://github.com/v0l/sims", rev = "ff342bc2bc39eb56172d2c5dc5fc06f5b24e24ac" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
thiserror = "2"
anyhow = "1"
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_bench = "0.3.0"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
