name = "i2c"
no_connect = ["U3.1", "U4.1", "U5.1", "U6.9"]
description = "An I2C-style open-drain bus: a controller and a target share SDA through open-drain buffers, 4.7k pull-ups make the 1, and a 74HC595 clocked by SCL captures the byte"

[[parts]]
ref = "J3"
symbol = "Conn_01x05"
value = "HOST"
at = [25.4, 50.8]
mirror = true

[[parts]]
ref = "U3"
symbol = "74LVC1G07"
value = "74LVC1G07"
at = [63.5, 38.1]
fields = { mpn = "TI SN74LVC1G07DCKR", role = "controller SCL" }

[[parts]]
ref = "U4"
symbol = "74LVC1G07"
value = "74LVC1G07"
at = [63.5, 63.5]
fields = { mpn = "TI SN74LVC1G07DCKR", role = "controller SDA" }

[[parts]]
ref = "U5"
symbol = "74LVC1G06"
value = "74LVC1G06"
at = [63.5, 88.9]
fields = { mpn = "TI SN74LVC1G06DCKR", role = "target ACK, pulls SDA low while ACK is high" }

[[parts]]
ref = "R2"
symbol = "R"
value = "4.7k"
at = [88.9, 30.48]

[[parts]]
ref = "R3"
symbol = "R"
value = "4.7k"
at = [96.52, 30.48]

[[parts]]
ref = "U6"
symbol = "74HC595"
value = "74HC595"
at = [124.46, 63.5]
fields = { mpn = "Nexperia 74HC595D", role = "bus monitor, shifts SDA on SCL" }

[[parts]]
ref = "J4"
symbol = "Conn_01x08"
value = "RX"
at = [160.02, 63.5]

[[parts]]
ref = "C3"
symbol = "C"
value = "100n"
at = [139.7, 30.48]

[[nets]]
name = "+3V3"
style = "power"
pins = ["U3.5", "U4.5", "U5.5", "U6.16", "U6.10", "R2.1", "R3.1", "C3.1"]

