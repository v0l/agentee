name = "frontend"
description = "RF front end between the baluns and the SMAs. RX: an SPDT pair (BGS12WN6) picks a QPL9547 LNA (0.1 to 6 GHz, 5 V) or a bypass. TX: the same pair around a TRF37A73 driver (1 to 6000 MHz, 12 dB). The input switches (U14, U17) take the bypass on RF2 with CTRL high; the output switches (U15, U19) are mirrored, bypass on RF1 with CTRL low, so both paths lay out without a crossing. Pull-ups on RX_BYPASS and TX_BYPASS, pull-downs on the _N controls, and pull-ups on the amplifier shutdowns keep the board in bypass with both amplifiers off until the gateware drives the pins"
board = "sdr"

