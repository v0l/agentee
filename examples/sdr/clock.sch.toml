name = "clock"
description = "External 10 MHz reference: SMA, 50 ohm termination, Schottky clamp, LTC6957-3 squarer (one output to the PLL, one to the FPGA). An ADF4002 locks the 40 MHz VCTCXO to it (R = 1, N = 4 at 10 MHz PFD) through a passive loop filter, and a TS5A3159 picks the VCTCXO tuning voltage: AUXDAC1 (VC_DAC high) or the loop (low). A PPS input through a Schmitt buffer, and an eight bit 3.3 V GPIO header with ESD"
board = "sdr"
no_connect = ["U23.1", "U25.6", "U25.7", "U25.9", "U25.10", "U26.6", "U26.7", "U26.9", "U26.10"]

