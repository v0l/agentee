[[stackup.layers]]
kind = "copper"
thickness = "0.5oz"
[[stackup.layers]]
kind = "prepreg"
material = "1080"
thickness = "0.0764mm"
er = 3.91
loss_tangent = 0.02
[[stackup.layers]]
kind = "copper"
thickness = "1oz"
[[stackup.layers]]
kind = "mask"
thickness = "15.2um"
