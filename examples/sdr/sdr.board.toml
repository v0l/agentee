[rules]
min_track_width = "0.09mm"
min_clearance = "0.09mm"
min_drill = "0.2mm"
min_via_drill = "0.2mm"
min_via_diameter = "0.35mm"
min_annular_ring = "0.075mm"
min_hole_to_hole = "0.25mm"

[[vias]]
name = "std"
drill = "0.3mm"
diameter = "0.5mm"

[[vias]]
name = "bga"
drill = "0.2mm"
diameter = "0.35mm"

[[netclasses]]
name = "Default"
description = "Control and low speed logic. Layers: F signal, In1 ground, In2 signal, In3 ground, In4 core power (1V0, 1V8), In5 IO power (3V3, 2V5, 1V3A), In6 ground, B signal"
track_width = "0.1mm"
clearance = "0.1mm"
via = "bga"

[[netclasses]]
name = "Power"
description = "Rails up to 1 A: 1V8, 2V5, 3V3, 1V3 and their branches"
track_width = "0.4mm"
clearance = "0.15mm"
current = "1A"
max_temp_rise = "10C"
layers = ["F.Cu", "B.Cu"]
neckdown = "1.5mm"
via = "std"

[[netclasses]]
name = "PowerHi"
description = "VBUS, VSYS and the 1V0 core rail: up to 2 A, carried by the In4.Cu plane and short outer runs"
track_width = "0.9mm"
clearance = "0.2mm"
current = "2A"
layers = ["F.Cu", "B.Cu"]
max_temp_rise = "10C"
neckdown = "1.5mm"
via = "std"

[[netclasses]]
name = "USB_SS"
description = "USB 3.2 Gen 1 lanes, 5 Gbps, the FX5 muxes them by plug orientation: 85 ohm pairs on F.Cu over In1.Cu, or B.Cu over In6.Cu for the connector's back row, same geometry"
impedance = "85ohm"
impedance_tolerance = "10%"
diff_gap = "0.15mm"
clearance = "0.15mm"
layers = ["F.Cu", "B.Cu"]
solver = "field"
max_skew = "0.1mm"
max_uncoupled = "1.5mm"
neckdown = "1.5mm"
via = "bga"

[[netclasses]]
name = "USB_HS"
description = "USB 2.0 D+/D-, 90 ohm on F.Cu or B.Cu"
impedance = "90ohm"
impedance_tolerance = "10%"
diff_gap = "0.15mm"
clearance = "0.15mm"
layers = ["F.Cu", "B.Cu"]
solver = "field"
neckdown = "1.5mm"
via = "bga"

[[netclasses]]
name = "LVDS"
description = "FPGA to FX5 LVDS receive link, 100 ohm pairs on In2.Cu between the In1 and In3 grounds, via in pad at both ends"
impedance = "100ohm"
impedance_tolerance = "10%"
diff_gap = "0.125mm"
clearance = "0.1mm"
layers = ["In2.Cu"]
solver = "field"
max_skew = "0.15mm"
max_uncoupled = "3mm"
via = "bga"

[[netclasses]]
name = "RF"
description = "50 ohm on F.Cu over In1.Cu: SMA to balun, and each balun leg to the AD9364 (two loosely coupled 50 ohm lines make the 100 ohm differential port)"
impedance = "50ohm"
impedance_tolerance = "5%"
coplanar_gap = "0.25mm"
track_width = "0.12mm"
clearance = "0.2mm"
layers = ["F.Cu"]
solver = "field"
via = "std"
