name = "sdr"
description = "1x1 70 MHz to 6 GHz SDR: AD9364, Artix-7 XC7A50T and an EZ-USB FX5 on USB 3.2 Gen 1, 61.44 MS/s full duplex"
fab = "jlcpcb"

[outline]
size = [90, 60]
corner_radius = 1.5

[stackup]
finish = "ENIG"
mask_color = "black"
silk_color = "white"

[[stackup.layers]]
kind = "silk"
[[stackup.layers]]
kind = "paste"
[[stackup.layers]]
kind = "mask"
thickness = "15.2um"
er = 3.8
[[stackup.layers]]
kind = "copper"
thickness = "1oz"
[[stackup.layers]]
kind = "prepreg"
material = "1080"
thickness = "0.0764mm"
er = 3.91
loss_tangent = 0.02
[[stackup.layers]]
kind = "copper"
thickness = "0.5oz"
[[stackup.layers]]
kind = "core"
material = "FR4"
thickness = "0.3mm"
er = 4.41
loss_tangent = 0.02
[[stackup.layers]]
kind = "copper"
thickness = "0.5oz"
[[stackup.layers]]
kind = "prepreg"
material = "7628"
thickness = "0.2104mm"
er = 4.4
loss_tangent = 0.02
[[stackup.layers]]
kind = "copper"
thickness = "0.5oz"
[[stackup.layers]]
kind = "core"
material = "FR4"
thickness = "0.3mm"
er = 4.41
loss_tangent = 0.02
[[stackup.layers]]
kind = "copper"
thickness = "0.5oz"
[[stackup.layers]]
kind = "prepreg"
material = "7628"
thickness = "0.2104mm"
er = 4.4
loss_tangent = 0.02
[[stackup.layers]]
kind = "copper"
thickness = "0.5oz"
[[stackup.layers]]
kind = "core"
