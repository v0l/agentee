name = "preamp-clip"
kind = "circuit"
description = "A 1 kHz sine of 400 mV peak from a 100 ohm source, more than the gain stage can pass: it clips at U1's output swing, 1.5 V under VCC and about 25 mV above ground. 245 mV peak is the most the input takes cleanly. U1 and D1 are modelled as in preamp-ac, from the LM358 and 1N4148 datasheets."
record = ["IN", "GAIN_OUT", "FILT_OUT", "OUT"]

[[drives]]
net = "VBAT"
dc = "9V"

[[drives]]
net = "VCC"
current = true
dc = "-0.7mA"

[[drives]]
net = "IN"
resistance = "100ohm"
sine = { offset = "0V", amplitude = "400mV", frequency = "1kHz" }

[tran]
stop = "5ms"
step = "2us"

[[checks]]
v = "GAIN_OUT"
at = "2.25ms"
min = 6.6
max = 6.95

[[checks]]
v = "GAIN_OUT"
at = "2.75ms"
min = 0
max = 0.05

[[blocks]]
ref = "U1"
kind = "opamp"
gain = 1e5
gbw = "0.7MHz"
en = "40n"
vos = "3mV"
headroom_high = "1.5V"
headroom_low = "5mV"
slew = "0.3V/us"
ib = "-20nA"
psrr = "100dB"

[[blocks]]
ref = "D1"
kind = "diode"
is = "5.56nA"
n = 1.974

[[checks]]
peak = "GAIN_OUT"
from = "1ms"
max = "7V"

[[checks]]
trough = "GAIN_OUT"
from = "1ms"
min = "0V"
max = "50mV"

[[checks]]
thd = "GAIN_OUT"
from = "1ms"
min = "12%"
