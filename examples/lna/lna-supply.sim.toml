name = "lna-supply"
kind = "circuit"
description = "The supply OR-ing: 5 V on J3 through D2, U1 drawing its bias current through L1, and the LED"
ignore = ["D3"]
record = ["VEXT", "VCC", "LED_A", "RF_AMP_OUT"]

[[blocks]]
ref = "U1"
kind = "resistor"
pins = { 1 = "3", 2 = "2" }
resistance = "55ohm"

[[drives]]
net = "VEXT"
dc = "5V"
steps = [["0s", "0V"], ["1ms", "0V"], ["2ms", "5V"]]

[tran]
stop = "10ms"
step = "10us"

[[checks]]
v = "VCC"
min = 4.55
max = 4.85

[[checks]]
i = "R1"
min = "2mA"
max = "3.5mA"

[[checks]]
v = "RF_AMP_OUT"
at = "10ms"
min = 4.5
