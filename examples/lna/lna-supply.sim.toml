name = "lna-supply"
kind = "circuit"
description = "The supply OR-ing: 5 V on J3 through D2 to U1's quiescent current through L1. U1 is a 90 mA sink (SPF5189Z datasheet: IDQ 90 mA at 5 V, held by its active bias). D1 and D2 are fitted to the BAT60A datasheet's typical VF, 0.12 V at 10 mA and 0.2 V at 100 mA (n 1.34, Is 316 uA). The LED and R1 are left out: the LED has no part number to take a VF from."
ignore = ["D3", "U1", "D4", "R1"]
record = ["VEXT", "VCC", "RF_AMP_OUT"]

[[blocks]]
value = "BAT60A"
kind = "schottky"
is = "316uA"
n = 1.34

[[drives]]
net = "VEXT"
dc = "5V"
steps = [["0s", "0V"], ["1ms", "0V"], ["2ms", "5V"]]

[[drives]]
net = "RF_AMP_OUT"
current = true
dc = "-90mA"

[tran]
stop = "10ms"
step = "10us"

[[checks]]
v = "VCC"
min = 4.75
max = 4.85

[[checks]]
i = "D2"
min = "89mA"
max = "91mA"

[[checks]]
v = "RF_AMP_OUT"
at = "10ms"
min = 4.75
