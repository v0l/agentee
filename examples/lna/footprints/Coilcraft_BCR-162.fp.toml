name = "Coilcraft_BCR-162"
description = "Coilcraft BCR-162/-221/-232/-531/-802 SMT broadband conical inductor, land pattern from Document 334R-2. Pad 1 is the narrow end, for the RF line. The MP pads only hold the bracket and must stay unconnected."
tags = ["inductor", "conical", "bias tee"]
mount = "smd"

[[pads]]
number = "1"
kind = "smd"
shape = "rect"
at = [2.4150, 1.5250]
size = [1.02, 1.02]
layers = ["F.Cu", "F.Mask", "F.Paste"]

[[pads]]
number = "2"
kind = "smd"
shape = "rect"
at = [-2.4150, -1.5250]
size = [1.02, 1.02]
layers = ["F.Cu", "F.Mask", "F.Paste"]

