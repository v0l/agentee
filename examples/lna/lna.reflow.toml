name = "lna"
layout = "lna"

[paste]
alloy = "SAC305"
name = "Chip Quik SMD291SNL SynTECH-LF"
peak = [230, 249]
preheat = [140, 200]
soak_time = [60, 90]
max_ramp_up = 2.0
time_above_liquidus = [30, 60]
cooling = [2, 4]
flux_activation = [140, 200]
source = "https://media.digikey.com/pdf/Data%20Sheets/Chip%20Quik%20PDFs/SMD291SNL(10).pdf"
page = "2"

[oven]
kind = "convection"
max_temp = 300

[[parts]]
refs = ["C1", "C2", "C3", "C4", "C5", "C6", "R1"]
max_peak = 260
max_time_at_peak = 30
max_passes = 3
msl = 1
capable = "reflow"
source = "https://pim.murata.com/asset/pim4/ceramicCapacitorSMD/GRM1555C1H222GA01-01A-EN_PDF_CERAMICCAPACITORSMD"
page = "16"
confidence = "inferred"
note = "Murata GRM 0402 family: recommended peak 240 to 260 C, Sn-3.0Ag-0.5Cu, dT 190 C max. The GRM155 parts here are not that exact datasheet, and R1 (a generic 0402 resistor) is covered by the same chip default, so it is inferred."

[[parts]]
refs = ["D1", "D2"]
max_peak = 260
max_time_at_peak = 30
max_passes = 3
msl = 1
capable = "reflow"
source = "https://www.infineon.com/dgdl/Infineon-General_Recommendations_for_Assembly_of_Infineon_Packages-AN-v04_00-EN.pdf?fileId=5546d46268554f4a016893f69ddf5e63"
confidence = "inferred"
note = "BAT60A is Pb-free (BAT60A datasheet page 1). Infineon states its packages are qualified to J-STD-020 and the standards give 260 C max; the BAT60A datasheet itself lists no MSL."

[[parts]]
refs = ["D3"]
max_peak = 260
max_time_at_peak = 30
max_passes = 3
msl = 1
capable = "reflow"
source = "J-STD-020E Table 4-2, package under 1.6 mm thick and under 350 mm3"
confidence = "inferred"
note = "WLL-2-3 0.58 x 0.28 x 0.15 mm. The ESD131 datasheet gives no reflow data, so this is the J-STD-020 classification for its size."

[[parts]]
refs = ["U1"]
max_peak = 260
max_time_at_peak = 30
max_passes = 3
msl = 3
capable = "reflow"
source = "J-STD-020E Table 4-2, SOT-89 under 1.6 mm thick and under 350 mm3"
confidence = "assumed"
note = "The Qorvo SPF5189Z datasheet could not be fetched (HTTP 429 from qorvo.com, access denied at mouser.com). MSL 3 is a safe default for a plastic IC. Replace from the datasheet."
