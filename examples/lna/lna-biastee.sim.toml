name = "lna-biastee"
kind = "circuit"
description = "How far the bias tee (L3, C5) keeps RF on RF_OUT off VBIAS, from a 50 ohm source. U1 is its 90 mA quiescent current (SPF5189Z datasheet), D1 and D2 the BAT60A fitted to its typical VF (0.12 V at 10 mA, 0.2 V at 100 mA) with its 20 pF typical capacitance at 5 V reverse. The LED and R1 are left out: the LED has no part number."
ignore = ["D3", "U1", "D4", "R1"]
record = ["RF_OUT", "VBIAS"]

[[blocks]]
value = "BAT60A"
kind = "schottky"
is = "316uA"
n = 1.34
cj = "20pF"

[[drives]]
net = "VEXT"
dc = "5V"

[[drives]]
net = "RF_AMP_OUT"
current = true
dc = "-90mA"

[[drives]]
net = "RF_OUT"
ac = 1
resistance = "50ohm"

[ac]
from = "100kHz"
to = "4GHz"
points = 20

[[checks]]
v = "VBIAS"
at = "50MHz"
max = -50

[[checks]]
v = "VBIAS"
at = "1GHz"
max = -60
