name = "stepper"
description = "Two-axis stepper controller. TMC2209 support parts from its datasheet (rev 1.09, 2.2 and 21): 22 nF CPO-CPI, 100 nF VCP-VS, 4.7 uF on 5VOUT, 100 nF plus 100 uF electrolytic on VS, 0.11 ohm sense resistors, CLK tied to GND for the internal clock, VREF to GND with GCONF.I_scale_analog cleared over UART, MS1 high on U4 for UART address 1. AP63203 values from its datasheet table 2: 10 uF in, 100 nF BST-SW, 3.9 uH, 2 x 22 uF out. STM32H563 decoupling from AN5711: 100 nF per VDD, 4.7 uF bulk, 1 uF + 100 nF on VDDA, 2.2 uF per VCAP."
