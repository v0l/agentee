name = "usb"
description = "USB-C device port: 5.1k CC pull-downs (USB Type-C 4.5.1.3.1), USBLC6-2SC6 ESD on D+ and D- and VBUS (ST datasheet: place it as close as possible to the connector)."
board = "controller"
no_connect = ["J2.A8", "J2.B8", "J2.S1"]

[[parts]]
ref = "J2"
symbol = "USB_C_Receptacle_USB2.0_16P"
at = [38.10, 228.60]
value = "TYPE-C-31-M-12"
fields = { mpn = "TYPE-C-31-M-12", mfr = "HRO" }

[[parts]]
ref = "U3"
symbol = "USBLC6-2SC6"
at = [76.20, 228.60]
value = "USBLC6-2SC6"
fields = { mpn = "USBLC6-2SC6", mfr = "ST" }

[[parts]]
ref = "R5"
symbol = "R"
at = [57.15, 254.00]
value = "5.1k"

[[parts]]
ref = "R6"
symbol = "R"
at = [66.04, 254.00]
value = "5.1k"

[[nets]]
name = "GND"
class = "Ground"
style = "power"
pins = ["J2.A1", "J2.A12", "J2.B1", "J2.B12", "U3.2", "R5.2", "R6.2"]

[[nets]]
name = "VBUS"
class = "Signal"
style = "label"
pins = ["J2.A4", "J2.A9", "J2.B4", "J2.B9", "U3.5"]

[[nets]]
name = "USB_DP"
class = "USB"
style = "label"
pins = ["J2.A6", "J2.B6", "U3.1", "U3.6"]

[[nets]]
name = "USB_DM"
class = "USB"
style = "label"
pins = ["J2.A7", "J2.B7", "U3.3", "U3.4"]

[[nets]]
name = "CC1"
class = "Signal"
style = "label"
pins = ["J2.A5", "R5.1"]

[[nets]]
name = "CC2"
class = "Signal"
style = "label"
pins = ["J2.B5", "R6.1"]
