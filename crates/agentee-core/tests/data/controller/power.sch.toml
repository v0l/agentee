name = "power"
description = "12 V in through a Bourns MF-MSMF110/16 PTC (16 V, 1.1 A hold), a B5819W reverse-polarity Schottky (40 V, 1 A) and an SMBJ15A TVS (15 V standoff, 24.4 V clamp), a 100 uF bulk electrolytic, then an AP63200 buck to 3V3 with the datasheet table 1 values for 3.3 V: R1 196k, R2 62k, C4 100 pF, L 6.8 uH (SRN4018-6R8M, 1.5 A), C1 10 uF, C2 2 x 22 uF, C3 100 nF. AP63200 layout guide: VIN caps and feedback parts close to the device."
