name = "analog"
description = "10k NTC on J4 from a 10k divider off 3V3, a 1k series resistor into an MCP6001 (MCP6001 datasheet 4.1.2 limits input current), gain 1.51 (Rf 5.1k, Rg 10k), 100 nF bypass within 2 mm of VDD (datasheet 4.4), and a 1k / 100 nF filter (1.6 kHz) into the ADC pin."
